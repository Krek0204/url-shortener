services:
  db:
    image: postgres:16-alpine
    container_name: url-shortener-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .

    container_name: app-container

    command: sh -c "uv run alembic upgrade head && uv run url-shortener"

    healthcheck:
      test: [
        "CMD",
        "python",
        "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
      ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    ports:
      - "8000:8000"

    environment:
      - "POSTGRES_USER=${POSTGRES_USER}"
      - "POSTGRES_PASSWORD=${POSTGRES_PASSWORD}"
      - "POSTGRES_DB=${POSTGRES_DB}"
      - "POSTGRES_HOST=url-shortener-db"
      - "PORT=${PORT}"
      - "PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}"
      - 'CORS_ORIGINS=${CORS_ORIGINS}'

    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
