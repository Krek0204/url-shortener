[project]
name = "url-shortener"
version = "0.1.0"
description = "Simple short-url service"
readme = "README.md"
authors = [
    { name = "Krek0204", email = "Vlad020406@yandex.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "psycopg[binary]>=3.3.4",
    "pybase62>=1.0.0",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "redis>=8.1.0",
    "sqlalchemy>=2.0.52",
]

[project.scripts]
url-shortener = "url_shortener.main:run"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
